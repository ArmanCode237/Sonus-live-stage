<!-- partials/modal-browser.html — Navegador de samples -->
<div class="modal-backdrop" id="modalBrowser">
  <div class="modal-window" style="width:940px;">
    <div class="modal-top">
      <h3>📂 Gestor y Clasificador de Librería Nord</h3>
      <button class="close-modal-btn" onclick="closeModal('modalBrowser')">Cerrar ✕</button>
    </div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="libDirInput" value="./samples" style="flex:1; background:#0d1015; color:#fff; border:1px solid #475569; padding:7px 10px; border-radius:6px;">
      <button class="wrench-btn" onclick="scanLibrary()">Re-escanear Carpeta</button>
    </div>
    <div class="browser-workspace">
      <div class="browser-sidebar" id="browserCategorySidebar"></div>
      <div class="browser-main-pane">
        <div class="browser-toolbar">
          <input type="text" id="searchSampleInput" placeholder="🔍 Buscar sample por nombre..." oninput="renderBrowserList()">
          <select id="sortSampleSelect" onchange="renderBrowserList()">
            <option value="name_asc">Orden: Nombre (A → Z)</option>
            <option value="name_desc">Orden: Nombre (Z → A)</option>
            <option value="size_desc">Orden: Tamaño (Mayor a menor)</option>
            <option value="size_asc">Orden: Tamaño (Menor a mayor)</option>
            <option value="ext_asc">Orden: Formato (.npno, .nsmp...)</option>
          </select>
          <select id="extFilterSelect" onchange="renderBrowserList()">
            <option value="ALL">Todos los formatos</option>
            <option value=".npno">Solo .npno (Piano)</option>
            <option value=".nsmp">Solo .nsmp / .nsmp3 / .nsmp4</option>
            <option value="PROG">Solo Programas (.ns3f/.nw2p)</option>
          </select>
        </div>
        <div class="browser-list" id="libraryList"></div>
      </div>
    </div>
  </div>
</div>
