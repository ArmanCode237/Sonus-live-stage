<!-- partials/topbar.html — Barra superior compartida (Audio/MIDI, estado, master) -->
<div class="top-strip">
  <div style="display:flex; gap:6px;">
    <button class="wrench-btn" id="btnAudioMidiTop" onclick="openSettingsWindow()"><span data-ui-icon="headphones"></span> AUDIO / MIDI</button>
    <button class="wrench-btn" onclick="openModal('modalVoiceConfig')" title="Configuración de Loop Hold, Release, ADSR y Polifonía"><span data-ui-icon="settings"></span> SAMPLE CONFIG</button>
    <button class="wrench-btn active-toggle" id="btnToggleKeyboard" onclick="toggleKeyboardVisibility()"><span data-ui-icon="keyboard"></span> KEYBOARD 88</button>
  </div>

  <div class="info-bar-box">
    <div class="k-info-row">
      <span id="midiConnectionBadge" class="hw-badge off">MIDI: OFF</span>
      <span id="midiStatusTop" style="color:#93c5fd;">Waiting...</span>
    </div>
    <div class="k-info-row">
      <span>Voices: <strong id="activeVoicesText">0</strong>/<strong id="maxVoicesTopLabel">128</strong></span>
      <span>|</span>
      <span id="pedalBadgeTop" style="color:#86efac;">Pedal: UP</span>
    </div>
    <div class="k-info-row" style="justify-content:flex-end;">
      <span>RAM: <strong id="ramTopText">0.0 MB</strong></span>
      <button class="expand-btn" onclick="openModal('modalBrowser')"><span data-ui-icon="folder"></span> BROWSER</button>
    </div>
  </div>

  <div class="top-master-area">
    <div class="knob-cell" data-id="tune" data-min="-50" data-max="50" data-val="0" data-log="0" data-unit="ct" data-label="TUNE" data-small="1"></div>
    <div class="knob-cell" data-id="pan" data-min="-1.0" data-max="1.0" data-val="0.0" data-log="0" data-unit="Pan" data-label="PAN" data-small="1"></div>
    <div class="knob-cell" data-id="volume" data-min="0.0" data-max="1.5" data-val="0.85" data-log="0" data-unit="%" data-label="MASTER" data-small="1"></div>
    <div class="vu-stack">
      <div class="vu-bar-bg"><div class="vu-bar-fg" id="vuL"></div></div>
      <div class="vu-bar-bg"><div class="vu-bar-fg" id="vuR"></div></div>
    </div>
    <div class="clip-dot" id="clipLed" title="Indicador de saturación (Clip)"></div>
  </div>
</div>
