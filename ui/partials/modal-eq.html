<!-- partials/modal-eq.html — Ecualizador paramétrico de 5 bandas -->
<div class="modal-backdrop" id="modalEq">
  <div class="modal-window">
    <div class="modal-top">
      <h3>🎛 Ecualizador Paramétrico de 5 Bandas (Frecuencia · Factor Q · Ganancia) + HPF / LPF</h3>
      <div style="display:flex; gap:8px;">
        <button class="expand-btn" style="padding:4px 10px;" onclick="resetParametricEq()">Reset (0 dB)</button>
        <button class="close-modal-btn" onclick="closeModal('modalEq')">Cerrar ✕</button>
      </div>
    </div>
    <canvas id="eqGraphCanvas" class="graph-canvas" width="900" height="140"></canvas>
    <div style="display:flex; justify-content:space-around; background:#1b2028; padding:8px; border-radius:8px; border:1px solid #334155;">
      <div class="knob-cell" data-id="lowCut" data-min="20" data-max="800" data-val="20" data-log="1" data-unit="Hz" data-label="LOW CUT (HPF)"></div>
      <div class="knob-cell" data-id="highCut" data-min="1500" data-max="20000" data-val="20000" data-log="1" data-unit="Hz" data-label="HIGH CUT (LPF)"></div>
    </div>
    <div class="param-eq-grid" id="paramEqBandsContainer"></div>
  </div>
</div>
