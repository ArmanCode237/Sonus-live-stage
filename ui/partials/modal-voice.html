<!-- partials/modal-voice.html — Configuración de voces, loop y ADSR -->
<div class="modal-backdrop" id="modalVoiceConfig">
  <div class="modal-window" style="width:780px;">
    <div class="modal-top">
      <h3>Configuración de Sample, Sustain Loop, Envolvente ADSR y Polifonía</h3>
      <button class="close-modal-btn" onclick="closeModal('modalVoiceConfig')">Cerrar ✕</button>
    </div>
    <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:14px;">
      <div class="eq-band-card">
        <div class="eq-band-title">AMPLIFIER ENVELOPE (A · D · S · R) & SUSTAIN LOOP HOLD</div>
        <div style="display:flex; justify-content:space-around; width:100%; padding:10px 0;">
          <div class="knob-cell" data-id="attack" data-min="0.001" data-max="4.0" data-val="0.001" data-log="1" data-unit="s" data-label="ATTACK"></div>
          <div class="knob-cell" data-id="decay" data-min="0.02" data-max="8.0" data-val="3.50" data-log="1" data-unit="s" data-label="DECAY"></div>
          <div class="knob-cell" data-id="sustain" data-min="0.0" data-max="1.0" data-val="1.00" data-log="0" data-unit="%" data-label="SUSTAIN"></div>
          <div class="knob-cell" data-id="release" data-min="0.02" data-max="6.0" data-val="0.35" data-log="1" data-unit="s" data-label="RELEASE"></div>
          <div class="knob-cell" data-id="loopHold" data-min="0.0" data-max="1.0" data-val="0.65" data-log="0" data-unit="Hold" data-label="LOOP HOLD"></div>
        </div>
      </div>
      <div class="eq-band-card">
        <div class="eq-band-title">SYNTH / FILTER & POLYPHONY ENGINE</div>
        <div style="display:flex; justify-content:space-around; width:100%; padding:6px 0;">
          <div class="knob-cell" data-id="cutoff" data-min="20" data-max="20000" data-val="20000" data-log="1" data-unit="Hz" data-label="CUTOFF"></div>
          <div class="knob-cell" data-id="resonance" data-min="0.5" data-max="12.0" data-val="0.71" data-log="0" data-unit="Q" data-label="RESONANCE"></div>
        </div>
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center; padding:6px 12px; background:#111827; border-radius:6px;">
          <span style="font-size:11px; font-weight:800;">LÍMITE DE VOCES (POLIFONÍA):</span>
          <select class="voices-select" id="maxVoicesSelect" style="width:auto;" onchange="changeMaxVoices(this.value)">
            <option value="32">32 Voces</option>
            <option value="64">64 Voces</option>
            <option value="128" selected>128 Voces</option>
            <option value="192">192 Voces</option>
            <option value="256">256 Voces (Máx)</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
